name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: bash -n tests/skills_test.sh
      - run: bash -n tests/orchestrator_handoff_test.sh
      - run: >-
          python3 -m json.tool
          skills/workflow/orchestrate-implementation/evals/evals.json
      - run: >-
          python3 -m json.tool
          tests/fixtures/orchestrator-skill-handoffs.json
      - run: python3 -m json.tool tests/routing_prompts.json >/dev/null
      - run: python3 -m json.tool sources.json >/dev/null
      - run: bash tests/skills_test.sh
      - run: bash tests/orchestrator_handoff_test.sh
      - run: git diff --check
